name: release

# Builds the addon zip, uploads it to CurseForge (project id in the TOC) and attaches it to a
# GitHub release. Two ways to start it:
#   * push a tag like v0.13.0 (release), v0.14.0-beta1 (beta) or v0.14.0-alpha1 (alpha), or
#   * Actions > release > Run workflow, with the tag name: the job creates the tag on main itself.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create on main and release, e.g. v0.13.0 or v0.14.0-beta1"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
          fetch-depth: 0 # the packager reads tags and history

      - name: Check the tag matches the TOC version
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)[0-9]*)?$ ]]; then
            echo "Tag $TAG should look like v1.2.3, v1.2.3-beta1 or v1.2.3-alpha1" >&2
            exit 1
          fi
          toc=$(grep -oP '^## Version:\s*\K\S+' AssistCompanion/AssistCompanion.toc)
          tag="${TAG#v}"
          if [ "${tag%%-*}" != "$toc" ]; then
            echo "Tag $TAG doesn't match the TOC version $toc" >&2
            exit 1
          fi

      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Run tests
        run: lua5.1 tests/harness.lua AssistCompanion

      - name: Create the tag (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Assist Companion $TAG"
          git push origin "$TAG"

      - name: Package and upload
        uses: BigWigsMods/packager@v2
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_KEY }}
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
